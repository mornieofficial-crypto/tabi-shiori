name = "tabi-shiori-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# アプリを配信しているオリジンだけに限定する(公開サイトのURLに合わせる)
ALLOWED_ORIGIN = "https://mornieofficial-crypto.github.io"

[[d1_databases]]
binding = "DB"
database_name = "tabi-shiori-relay-db"
# `npx wrangler d1 create tabi-shiori-relay-db` で表示された database_id に置き換える
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
